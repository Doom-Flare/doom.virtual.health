name: 功能建议
description: 想给 doom.virtual.health 加一个能力，或改一处现有行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚**你想解决什么问题**，再说你想加什么命令 —— 这样我们能判断是该加 API、该改默认值，还是本来就能用现有 API 拼出来。

        提之前建议先扫一眼 [docs/02-用法与API.md](https://github.com/Doom-Flare/doom.virtual.health/blob/main/docs/02-用法与API.md)：
        22 个核心 API + 3 个 bossbar API + 7 个 predicate 已经覆盖了不少玩法，很多时候组合现有 API 就够。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      placeholder: |
        我想做"Boss 血量低于 30% 时进二阶段"，但 predicate 只能判"现在是不是低于阈值"，
        没有"刚刚跨过阈值"这种一次性事件……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它长什么样
      description: 如果心里有具体写法（函数名 / 参数 / 返回值），照写；没有就描述期望效果
      placeholder: |
        期望：/function doom.virtual.health:api/on_cross {pct:30, run:"function mypack:phase2"}
        语义：血量从 ≥30% 掉到 <30% 的那一刻执行一次，不重复触发
      render: text
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 这属于哪一类
      options:
        - 核心虚拟血量（doom.virtual.health）
        - Bossbar 血条（doom.bossbar）
        - 文档 / 示例
        - 兼容性（新 MC 版本 / 和其它包共存）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 你现在是怎么绕过去的
      description: 如果已经有 workaround（哪怕是丑的），写出来 —— 它常常直接变成实现方案
      render: text
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: 你接受它改变现有行为吗
      options:
        - 只能新增，不许动现有 API 的语义（推荐）
        - 可以改现有默认值，但要在 CHANGELOG 里写清楚
        - 无所谓，好用就行
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过 Issues，没有重复的建议
          required: true
